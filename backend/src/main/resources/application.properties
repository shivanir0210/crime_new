# CrimeSphere Backend Configuration - Phase 3 Authentication & Security
server.port=8080
spring.application.name=CrimeSphere Backend

# Database Configuration with Environment Variable Substitution (PostgreSQL Default)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crimesphere_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
# Safe default development 256-bit key for local testing; overridden by JWT_SECRET env var in staging/production
security.jwt.secret=${JWT_SECRET:crimeSphereSuperSecureJwtSecretKeyForPoliceIntelligenceSystem2026!}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Spring Mail SMTP Configuration (Station Head Login Alerts)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
# Resend Mail API Configuration
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.api-url=${RESEND_API_URL:https://api.resend.com}

# MFA / OTP Demo Delivery Configuration (for sandbox email delivery)
mfa.demo-email.enabled=${MFA_DEMO_EMAIL_ENABLED:true}
mfa.demo-recipient-email=${MFA_DEMO_RECIPIENT_EMAIL:shivanirasappan@gmail.com}

# Multipart & Evidence File Upload Configuration (Max 50MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
evidence.upload.max-size=50MB
evidence.upload.max-size-bytes=52428800

# Secure Storage Configuration (Supabase Storage with Local Storage Fallback)
storage.evidence.local-dir=${STORAGE_LOCAL_DIR:./storage/evidence}
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.evidence-bucket=${SUPABASE_EVIDENCE_BUCKET:crime-evidence}

# FastAPI AI Service Configuration (Phase 8 Foundation)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.api-key=${AI_SERVICE_API_KEY:crime-sphere-internal-ai-key-2026-prod}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:30000}

# WhatsApp Cloud API Configuration (Phase 13)
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
whatsapp.api-version=${WHATSAPP_API_VERSION:v19.0}
whatsapp.template-enabled=${WHATSAPP_TEMPLATE_ENABLED:false}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}

# Notification Retry Configuration (Phase 13)
notification.max-retries=${NOTIFICATION_MAX_RETRIES:3}

# Public Search & News Intelligence Configuration (Phase 14)
PUBLIC_SEARCH_MOCK_ENABLED=${PUBLIC_SEARCH_MOCK_ENABLED:false}

crimesphere.public-search.provider=${PUBLIC_SEARCH_PROVIDER:newsapi}
crimesphere.public-search.api-key=${NEWS_API_KEY:${PUBLIC_SEARCH_API_KEY:}}
crimesphere.public-search.base-url=${PUBLIC_SEARCH_BASE_URL:https://newsapi.org/v2}
crimesphere.public-search.timeout-seconds=${PUBLIC_SEARCH_TIMEOUT_SECONDS:15}
crimesphere.public-search.max-results=${PUBLIC_SEARCH_MAX_RESULTS:10}
crimesphere.public-search.rate-limit-per-minute=${PUBLIC_SEARCH_RATE_LIMIT_PER_MINUTE:20}
crimesphere.public-search.cache-minutes=${PUBLIC_SEARCH_CACHE_MINUTES:5}
crimesphere.public-search.mock-enabled=${PUBLIC_SEARCH_MOCK_ENABLED:false}

# Gemini Image Generation & AI Scene Visualizer Configuration (Phase 17)
gemini.api.key=${GEMINI_API_KEY:}
gemini.image.model=${GEMINI_IMAGE_MODEL:imagen-3.0-generate-002}
gemini.image.timeout-seconds=${GEMINI_IMAGE_TIMEOUT_SECONDS:45}
gemini.image.mock-enabled=${GEMINI_IMAGE_MOCK_ENABLED:false}



