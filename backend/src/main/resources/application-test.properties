# CrimeSphere Test Configuration - H2 In-Memory Database Profile
spring.datasource.url=jdbc:h2:mem:crimespheredb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Settings for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during fast H2 unit testing if tests use JPA DDL auto
spring.flyway.enabled=false
