# CrimeSphere Test Properties - H2 In-Memory Database for Unit/Integration Tests
spring.datasource.url=jdbc:h2:mem:crimespheredb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Settings for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled for isolated test repository mocks
spring.flyway.enabled=false
